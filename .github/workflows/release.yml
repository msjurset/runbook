name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate man page embed
        run: make generate

      - name: Run tests
        run: go test -v ./...

      - name: Build release artifacts
        run: make release VERSION=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          BASE_URL="https://github.com/msjurset/runbook/releases/download/${GITHUB_REF_NAME}"

          # Source-tarball builds previously failed because internal/manpage/runbook.1
          # is gitignored — `go:embed` couldn't find it during `brew install`.
          # We now ship the prebuilt platform tarballs (already produced by
          # `make release`) and have the formula install them directly.
          declare -A SHA
          for arch in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            SHA[$arch]=$(shasum -a 256 "dist/runbook-${VERSION}-${arch}.tar.gz" | cut -d' ' -f1)
          done

          git clone https://x-access-token:${TAP_TOKEN}@github.com/msjurset/homebrew-tap.git /tmp/homebrew-tap
          cat > /tmp/homebrew-tap/Formula/runbook.rb <<FORMULA
          class Runbook < Formula
            desc "Run multi-step operational procedures defined in YAML"
            homepage "https://github.com/msjurset/runbook"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/runbook-${VERSION}-darwin-arm64.tar.gz"
                sha256 "${SHA[darwin-arm64]}"
              end
              on_intel do
                url "${BASE_URL}/runbook-${VERSION}-darwin-amd64.tar.gz"
                sha256 "${SHA[darwin-amd64]}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/runbook-${VERSION}-linux-arm64.tar.gz"
                sha256 "${SHA[linux-arm64]}"
              end
              on_intel do
                url "${BASE_URL}/runbook-${VERSION}-linux-amd64.tar.gz"
                sha256 "${SHA[linux-amd64]}"
              end
            end

            def install
              bin.install "runbook"
              man1.install "runbook.1"
              zsh_completion.install "_runbook"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/runbook --version")
            end
          end
          FORMULA
          sed -i 's/^          //' /tmp/homebrew-tap/Formula/runbook.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/runbook.rb
          git commit -m "runbook ${VERSION}"
          git push
